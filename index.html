    {w:"hang up", m:"挂起（衣服）"}

const UNITS = Object.keys(WORDS);
const ALL = [];
UNITS.forEach(u => WORDS[u].forEach(w => ALL.push(Object.assign({unit:u, key:u+'§'+w.w}, w))));

const store = {
  get(k, d){ try { const v = localStorage.getItem('vc_'+k); return v==null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('vc_'+k, JSON.stringify(v)); } catch(e){} }
};
const SRS = () => store.get('srs', {});
const setSRS = s => store.set('srs', s);
const getQuota = () => store.get('quota', 15);
const setQuota = n => store.set('quota', Math.max(1, Math.min(100, n|0)));
const wrong = () => store.get('wrong', []);
const setWrong = a => store.set('wrong', a);

function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(str, n){ const [y,m,dd]=str.split('-').map(Number); const dt=new Date(y,m-1,dd); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
const INTERVAL = [1,2,4,7,15,30];

function dailyNewCount(){
  const d = store.get('daily', {date:'', n:0});
  return d.date===today() ? d.n : 0;
}
function bumpDaily(){
  const d = store.get('daily', {date:'', n:0});
  const t = today();
  store.set('daily', d.date===t ? {date:t, n:d.n+1} : {date:t, n:1});
}
function todayQueue(){
  const s=SRS(), t=today();
  const due=[], fresh=[];
  for(const it of ALL){
    const e=s[it.key];
    if(!e) fresh.push(it);
    else if(e.due<=t && e.st<99) due.push(it);
  }
  const remaining = Math.max(0, getQuota() - dailyNewCount());
  return { due, fresh: fresh.slice(0, remaining) };
}

const $ = id => document.getElementById(id);
const MODES = [['today','今日任务'],['browse','浏览'],['quiz','测试'],['review','错词本']];
let curMode = 'today', curTab = UNITS[0];
let idx=0, flipped=false, todayList=[], tPos=0, quizWord=null, quizOpts=[], quizAnswered=false;

function renderModes(){
  $('modes').innerHTML = MODES.map(([k,n])=>`<div class="mode ${k===curMode?'on':''}" data-m="${k}">${n}</div>`).join('');
  $('modes').querySelectorAll('.mode').forEach(el=>el.onclick=()=>{
    curMode=el.dataset.m; idx=0; flipped=false; quizWord=null; quizAnswered=false;
    if(curMode==='today'){ todayList=[]; tPos=0; }
    renderModes(); render();
  });
}
function renderTabs(){
  const show = (curMode==='browse' || curMode==='quiz');
  if(!show){ $('tabs').innerHTML=''; return; }
  $('tabs').innerHTML = UNITS.map(k=>`<div class="tab ${k===curTab?'on':''}" data-k="${k}">${k}</div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ curTab=el.dataset.k; idx=0; flipped=false; quizWord=null; renderTabs(); render(); });
}
function render(){ const app=$('app'); if(curMode==='today') renderToday(app); else if(curMode==='browse') renderBrowse(app); else if(curMode==='quiz') renderQuiz(app); else renderReview(app); }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function applyAnswer(it, grade){
  const s=SRS(), t=today(); const e=s[it.key]; const isNew=!e;
  if(grade==='know'){
    const st=Math.min(e?e.st+1:1, 6);
    s[it.key]={st, due:addDays(t, INTERVAL[st-1]), seen:t};
    setWrong(wrong().filter(x=>x!==it.key));
  } else if(grade==='fuzzy'){
    s[it.key] = isNew ? {st:1, due:addDays(t,1), seen:t} : Object.assign({}, e, {due:addDays(t,1)});
  } else {
    s[it.key]={st:1, due:addDays(t,1), seen:t};
    if(!wrong().includes(it.key)) setWrong(wrong().concat(it.key));
  }
  if(isNew) bumpDaily();
  setSRS(s);
}

function renderToday(app){
  if(todayList.length===0){
    const {due, fresh} = todayQueue();
    todayList = due.concat(fresh); tPos=0;
  }
  let html = `<div class="settings">
    <span>每天新词</span><button id="qMinus">−</button><b>${getQuota()}</b><button id="qPlus">+</button>
    <span class="reset" id="resetBtn">重置进度</span>
  </div>`;
  if(todayList.length===0){
    html += `<div class="empty">🎉 今天没有要背的了。<br>要么词都背完了，要么新词额度用完了——明天再来，或调大「每天新词」。</div>`;
    app.innerHTML = html; wireSettings(); return;
  }
  if(tPos>=todayList.length){
    html += `<div class="empty">✅ 今天的任务完成啦！<br>按遗忘曲线，到点的复习和新词都过了一遍。<br>明天再来，别断。</div>`;
    app.innerHTML = html; todayList=[]; tPos=0; return;
  }
  const it = todayList[tPos];
  html += `
    <div class="stat">今日任务 ${tPos+1} / ${todayList.length}</div>
    <div class="card" id="card">
      ${flipped ? `<div class="m">${it.m}</div>` : `<div class="w">${it.w}</div>${it.p?`<div class="phon">${it.p}</div>`:''}`}
      <div class="hint">${flipped ? '想起来了没？' : '点我翻面看释义'}</div>
    </div>
    ${flipped ? `<div class="row">
      <button class="btn red" id="f">忘记</button>
      <button class="btn grey" id="z">模糊</button>
      <button class="btn green" id="k">认识</button>
    </div>` : ''}
  `;
  app.innerHTML = html;
  $('card').onclick = ()=>{ flipped=!flipped; render(); };
  if(flipped){
    $('f').onclick=()=>{ applyAnswer(it,'forgot'); next(); };
    $('z').onclick=()=>{ applyAnswer(it,'fuzzy'); next(); };
    $('k').onclick=()=>{ applyAnswer(it,'know'); next(); };
  }
  function next(){ flipped=false; tPos++; render(); }
}
function wireSettings(){
  const qM=$('qMinus'), qP=$('qPlus'), r=$('resetBtn');
  if(qM) qM.onclick=()=>{ setQuota(getQuota()-1); render(); };
  if(qP) qP.onclick=()=>{ setQuota(getQuota()+1); render(); };
  if(r) r.onclick=()=>{ if(confirm('确定清空所有学习进度和错词本吗？')){ localStorage.removeItem('vc_srs'); localStorage.removeItem('vc_wrong'); localStorage.removeItem('vc_daily'); todayList=[]; tPos=0; render(); } };
}

function renderBrowse(app){
  const L=WORDS[curTab]; if(!L.length){ app.innerHTML='<div class="empty">这里还没有词。</div>'; return; }
  if(idx>=L.length) idx=0;
  const w=L[idx];
  app.innerHTML = `
    <div class="stat">${idx+1} / ${L.length} · ${curTab}</div>
    <div class="card" id="card">
      ${flipped ? `<div class="m">${w.m}</div>` : `<div class="w">${w.w}</div>${w.p?`<div class="phon">${w.p}</div>`:''}`}
      <div class="hint">${flipped ? '点我翻回去' : '点我翻面看释义'}</div>
    </div>
    <div class="row"><button class="btn blue" id="prev">上一个</button><button class="btn blue" id="next">下一个</button></div>
  `;
  $('card').onclick=()=>{ flipped=!flipped; render(); };
  $('prev').onclick=()=>{ idx=(idx-1+L.length)%L.length; flipped=false; render(); };
  $('next').onclick=()=>{ idx=(idx+1)%L.length; flipped=false; render(); };
}

function renderQuiz(app){
  const L=WORDS[curTab];
  if(!L.length){ app.innerHTML='<div class="empty">这里还没有词。</div>'; return; }
  if(!quizWord){
    quizWord=L[Math.floor(Math.random()*L.length)];
    quizOpts=shuffle([quizWord].concat(shuffle(L.filter(x=>x!==quizWord)).slice(0,3)));
    quizAnswered=false;
  }
  app.innerHTML = `
    <div class="stat">${curTab} · 测试</div>
    <div class="card" style="min-height:120px;"><div class="w" style="font-size:26px;">${quizWord.w}</div>${quizWord.p?`<div class="phon">${quizWord.p}</div>`:''}</div>
    <div class="opts">${quizOpts.map((o,i)=>`<div class="opt" data-i="${i}">${o.m}</div>`).join('')}</div>
  `;
  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    if(quizAnswered) return;
    quizAnswered=true;
    const i=+el.dataset.i, right=quizOpts[i].w===quizWord.w;
    if(right){ el.classList.add('right'); }
    else { el.classList.add('wrong');
      const key=curTab+'§'+quizWord.w; if(!wrong().includes(key)) setWrong(wrong().concat(key));
      app.querySelectorAll('.opt').forEach(o=>{ if(quizOpts[+o.dataset.i].w===quizWord.w) o.classList.add('right'); });
    }
    setTimeout(()=>{ quizWord=null; render(); }, 900);
  });
}

function renderReview(app){
  const L = wrong().map(k=>ALL.find(x=>x.key===k)).filter(Boolean);
  app.innerHTML = `<div class="stat">错词本 · 共 ${L.length} 个</div>`;
  if(!L.length){ app.innerHTML += '<div class="empty">错词本是空的 🎉<br>「今日任务」里点「忘记」、或测试答错的词会自动收进来。</div>'; return; }
  if(idx>=L.length) idx=0;
  const it=L[idx];
  app.innerHTML += `
    <div class="card" id="card">
      ${flipped ? `<div class="m">${it.m}</div>` : `<div class="w">${it.w}</div>${it.p?`<div class="phon">${it.p}</div>`:''}`}
      <div class="hint">${flipped ? '点我翻回去' : '点我翻面'}</div>
    </div>
    ${flipped ? `<div class="row"><button class="btn red" id="rNo">还不会</button><button class="btn green" id="rYes">会了</button></div>` : ''}
  `;
  $('card').onclick=()=>{ flipped=!flipped; render(); };
  if(flipped){
    $('rYes').onclick=()=>{ setWrong(wrong().filter(x=>x!==it.key)); idx++; flipped=false; render(); };
    $('rNo').onclick=()=>{ idx++; flipped=false; render(); };
  }
}

renderModes();
renderTabs();
render();
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
