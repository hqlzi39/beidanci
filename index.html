    {w:"migration", p:"/maɪˈgreɪʃn/", m:"迁徙；移居"},
    {w:"Dalmatian", p:"/dælˈmeɪʃn/", m:"达尔马提亚的"},
    {w:"shed", p:"/ʃed/", m:"棚，厂房，库房"},
    {w:"wrap", p:"/ræp/", m:"包，裹"},
    {w:"unwrap", p:"/ʌnˈræp/", m:"拆开，打开（包装）"},
    {w:"suspicious", p:"/səˈspɪʃəs/", m:"感到怀疑的；猜疑的"},
    {w:"suspiciously", p:"/səˈspɪʃəsli/", m:"怀疑地，不信任地"},
    {w:"pinch", p:"/pɪntʃ/", m:"一小撮；捏，掐，夹"},
    {w:"vanish", p:"/ˈvænɪʃ/", m:"突然不见，消失"},
    {w:"slope", p:"/sləʊp/", m:"斜面，斜坡"},
    {w:"peak", p:"/piːk/", m:"山顶，山峰；高峰，顶点"},
    {w:"stretch", p:"/stretʃ/", m:"延续，延伸；变大，变松；伸展"},
    {w:"overtake", p:"/ˌəʊvəˈteɪk/", m:"追上，超过；超越"},
    {w:"anticipate", p:"/ænˈtɪsɪpeɪt/", m:"预期，预料"},
    {w:"reluctance", p:"/rɪˈlʌktəns/", m:"勉强，不情愿"},
    {w:"stoop", p:"/stuːp/", m:"俯身，弯腰"},
    {w:"restraint", p:"/rɪˈstreɪnt/", m:"安全装置；抑制，克制；限制"},
    {w:"scrape", p:"/skreɪp/", m:"摩擦，擦伤；刮除"},
    {w:"delicate", p:"/ˈdelɪkət/", m:"易坏的，脆弱的；微妙的；精巧的"},
    {w:"grip", p:"/grɪp/", m:"紧握，紧抓；握力"},
    {w:"sway", p:"/sweɪ/", m:"摇摆，摆动，摇晃"},
    {w:"accompany", p:"/əˈkʌmpəni/", m:"陪伴，陪同"},
    {w:"tuna", p:"/ˈtjuːnə/", m:"金枪鱼"},
    {w:"awkward", p:"/ˈɔːkwəd/", m:"笨拙的，不灵巧的；令人尴尬的"},
    {w:"occasionally", p:"/əˈkeɪʒənəli/", m:"偶尔，有时"},
    {w:"dislike", p:"/dɪsˈlaɪk/", m:"不喜欢"},
    {w:"sip", p:"/sɪp/", m:"一小口；小口地喝，抿"},
    {w:"slow down", m:"（使）慢下来，减速"},
    {w:"make sense", m:"有意义，易于理解；是明智的"},
    {w:"at least", m:"至少，起码"},
    {w:"lay out", m:"铺开，展开"},
    {w:"hang up", m:"挂起（衣服）"}
  ]
};

const KEYS = Object.keys(WORDS);
let curTab = KEYS[0];
let curMode = 'study';  // study | quiz | review
let idx = 0;
let flipped = false;
let quizWord = null, quizOpts = [], quizAnswered = false;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('vc_'+k); return v==null?d:JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('vc_'+k, JSON.stringify(v)); } catch(e){} }
};
const wrong = () => store.get('wrong', []);           // array of "unit§word"
const setWrong = a => store.set('wrong', a);
const addWrong = key => { const a = wrong(); if(!a.includes(key)) a.push(key); setWrong(a); };
const delWrong = key => setWrong(wrong().filter(x=>x!==key));

function renderTabs(){
  $('tabs').innerHTML = KEYS.map(k =>
    `<div class="tab ${k===curTab?'on':''}" data-k="${k}">${k}</div>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ curTab=el.dataset.k; idx=0; flipped=false; quizWord=null; renderTabs(); render(); });
}
function renderModes(){
  const modes = [['study','学习'],['quiz','测试'],['review','错词本']];
  $('modes').innerHTML = modes.map(([k,n]) =>
    `<div class="mode ${k===curMode?'on':''}" data-m="${k}">${n}</div>`).join('');
  $('modes').querySelectorAll('.mode').forEach(el=>el.onclick=()=>{ curMode=el.dataset.m; idx=0; flipped=false; quizAnswered=false; quizWord=null; renderModes(); render(); });
}

function list(){ return WORDS[curTab]; }
function reviewList(){ return wrong().map(k=>{ const [u,w]=k.split('§'); const arr=WORDS[u]; const it=arr?arr.find(x=>x.w===w):null; return it?{key:k,word:it}:null; }).filter(Boolean); }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function render(){
  const app = $('app');
  if(curMode==='study') renderStudy(app);
  else if(curMode==='quiz') renderQuiz(app);
  else renderReview(app);
}

function renderStudy(app){
  const L = list();
  if(!L.length){ app.innerHTML='<div class="empty">这里还没有词。</div>'; return; }
  if(idx>=L.length){ idx=0; }
  const w = L[idx];
  const inWrong = wrong().includes(curTab+'§'+w.w);
  app.innerHTML = `
    <div class="stat">${idx+1} / ${L.length} · ${curTab}</div>
    <div class="card" id="card">
      ${flipped ? `<div class="m">${w.m}</div>` : `<div class="w">${w.w}</div>${w.p?`<div class="phon">${w.p}</div>`:''}`}
      <div class="hint">${flipped ? '点我翻回去' : '点我翻面看释义'}</div>
    </div>
    ${flipped ? `
      <div class="row">
        <button class="btn red" id="bNo">没记住</button>
        <button class="btn green" id="bYes">记得</button>
      </div>` : ''}
  `;
  $('card').onclick = () => { flipped=!flipped; render(); };
  if(flipped){
    $('bYes').onclick = ()=>{ if(inWrong) delWrong(curTab+'§'+w.w); idx++; flipped=false; render(); };
    $('bNo').onclick = ()=>{ addWrong(curTab+'§'+w.w); idx++; flipped=false; render(); };
  }
}

function renderQuiz(app){
  const L = list();
  if(!L.length){ app.innerHTML='<div class="empty">这里还没有词。</div>'; return; }
  if(!quizWord){
    quizWord = L[Math.floor(Math.random()*L.length)];
    const others = shuffle(L.filter(x=>x!==quizWord)).slice(0,3);
    quizOpts = shuffle([quizWord, ...others]);
    quizAnswered = false;
  }
  app.innerHTML = `
    <div class="stat">${curTab} · 测试</div>
    <div class="card" style="min-height:120px;"><div class="w" style="font-size:26px;">${quizWord.w}</div>${quizWord.p?`<div class="phon">${quizWord.p}</div>`:''}</div>
    <div class="opts">${quizOpts.map((o,i)=>`<div class="opt" data-i="${i}">${o.m}</div>`).join('')}</div>
  `;
  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    if(quizAnswered) return;
    quizAnswered = true;
    const i = +el.dataset.i;
    const right = quizOpts[i].w === quizWord.w;
    if(right){ el.classList.add('right'); }
    else { el.classList.add('wrong'); addWrong(curTab+'§'+quizWord.w);
      app.querySelectorAll('.opt').forEach(o=>{ if(quizOpts[+o.dataset.i].w===quizWord.w) o.classList.add('right'); });
    }
    setTimeout(()=>{ quizWord=null; render(); }, 900);
  });
}

function renderReview(app){
  const L = reviewList();
  app.innerHTML = `<div class="stat">错词本 · 共 ${L.length} 个</div>`;
  if(!L.length){ app.innerHTML += '<div class="empty">错词本是空的 🎉<br>去「学习」或「测试」里没记住的词会自动收进来。</div>'; return; }
  if(idx>=L.length) idx=0;
  const item = L[idx];
  const w = item.word;
  app.innerHTML += `
    <div class="card" id="card">
      ${flipped ? `<div class="m">${w.m}</div>` : `<div class="w">${w.w}</div>${w.p?`<div class="phon">${w.p}</div>`:''}`}
      <div class="hint">${flipped ? '点我翻回去' : '点我翻面'}</div>
    </div>
    ${flipped ? `
      <div class="row">
        <button class="btn red" id="rNo">还不会</button>
        <button class="btn green" id="rYes">会了</button>
      </div>` : ''}
  `;
  $('card').onclick = ()=>{ flipped=!flipped; render(); };
  if(flipped){
    $('rYes').onclick = ()=>{ delWrong(item.key); idx++; flipped=false; render(); };
    $('rNo').onclick = ()=>{ idx++; flipped=false; render(); };
  }
}

renderTabs();
renderModes();
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
